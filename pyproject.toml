[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "finoptions-engine"
version = "0.1.0"
description = "High-performance, financially explicit options research engine"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jørgen Sandhaug" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
dependencies = ["numpy>=2.5.1,<3"]

[dependency-groups]
dev = [
  "maturin==1.14.1",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "ty==0.0.59",
]

[tool.maturin]
manifest-path = "crates/finoptions-python/Cargo.toml"
python-source = "python"
module-name = "finoptions._native"
features = ["extension-module"]
locked = true
include = [
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = "THIRD_PARTY_NOTICES.md", format = ["sdist", "wheel"] },
  { path = "third_party/blake3/**/*", format = ["sdist", "wheel"] },
  { path = "third_party/rust-random/**/*", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # formatter owns trailing commas
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["INP001"]
"tests/**/*.py" = ["S101"]
"tools/generate_legendre_rules.py" = ["T201"]
"tools/generate_standard_normal_rules.py" = ["T201"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "error"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/Cargo.toml" },
  { file = "crates/**/*.rs" },
  { file = "python/**/*.py" },
  { file = "python/**/*.pyi" },
]
