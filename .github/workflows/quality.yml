name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Rust, Python, and package gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install exact Python
        run: uv python install 3.14.6

      - name: Resolve exact Rust toolchain
        run: rustup show active-toolchain

      - name: Synchronize exact environment
        run: uv sync --all-groups --locked

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-targets

      - name: Python format and lint
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .

      - name: Python strict types
        run: uv run --no-sync mypy

      - name: Build native development package
        run: uv run --no-sync maturin develop --profile dev-fast

      - name: Python integration tests
        run: uv run --no-sync pytest -q

      - name: Build release artifacts locally
        run: uv build

